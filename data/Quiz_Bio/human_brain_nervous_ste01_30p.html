        // State variables

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = []; // Store { questionData, selectedAnswer, isCorrect }
        let currentMode = 'full';

        // Map topic to Thai names for display
        const topicNames = {
            'reflex': 'รีเฟล็กซ์ (Reflex)',
            'brain': 'สมอง (Brain)',
            'nerves': 'ระบบเส้นประสาท',
            'autonomic': 'ระบบประสาทอัตโนมัติ',
            'behavior': 'พฤติกรรม',

        // ฟังก์ชันดึงประวัติการทำแบบทดสอบเพื่อหา "จุดอ่อน"
        function getWeakestTopics() {
            try {
                const stats = JSON.parse(localStorage.getItem('neuroQuizStats')) || {};
                let topicScores = [];
                
                for (let topic in stats) {
                    if (stats[topic].total >= 2) { // ต้องเคยทำอย่างน้อย 2 ครั้งถึงจะวิเคราะห์
                        let accuracy = stats[topic].correct / stats[topic].total;
                        topicScores.push({ topic, accuracy });
                    }
                }

                // เรียงลำดับจากความแม่นยำน้อย (อ่อน) ไปหามาก
                topicScores.sort((a, b) => a.accuracy - b.accuracy);
                return topicScores.map(t => t.topic);
            } catch (e) {
                console.warn("Could not access localStorage", e);
                return [];
            }
        }

        // ฟังก์ชันอัปเดตสถิติหลังจากตอบคำถาม
        function updateTopicStats(topic, isCorrect) {
            try {
                let stats = JSON.parse(localStorage.getItem('neuroQuizStats')) || {};
                if (!stats[topic]) {
                    stats[topic] = { correct: 0, total: 0 };
                }
                stats[topic].total += 1;
                if (isCorrect) {
                    stats[topic].correct += 1;
                }
                localStorage.setItem('neuroQuizStats', JSON.stringify(stats));
            } catch (e) {
                console.warn("Could not write to localStorage", e);
            }
        }

        // ฟังก์ชันจัดชุดข้อสอบสำหรับโหมด Adaptive (เน้นข้อที่อ่อน)
        function generateAdaptiveSet() {
            const weakestTopics = getWeakestTopics();
            let selectedQuestions = [];
            let allQuestions = [...quizData];
            
            // สลับลำดับข้อสอบก่อน
            allQuestions.sort(() => Math.random() - 0.5);

            // ถ้ามีประวัติจุดอ่อน ดึงหมวดที่อ่อนมาใส่ก่อน
            if (weakestTopics.length > 0) {
                const weakTopic = weakestTopics[0];
                const weakQuestions = allQuestions.filter(q => q.topic === weakTopic);
                
                // เอาข้อที่อ่อนมาสุด 4 ข้อ
                selectedQuestions.push(...weakQuestions.slice(0, 4));
            }

            // เติมข้ออื่นๆ ให้ครบ 10 ข้อ
            for (let q of allQuestions) {
                if (selectedQuestions.length >= 10) break;
                if (!selectedQuestions.includes(q)) {
                    selectedQuestions.push(q);
                }
            }

            // สลับลำดับอีกครั้งก่อนแสดงผล
            return selectedQuestions.sort(() => Math.random() - 0.5);
        }

        // UI Navigation functions
        function showScreen(screenId) {
            // Hide all screens
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-review').classList.add('hidden');
            
            // Show target screen
            document.getElementById('screen-' + screenId).classList.remove('hidden');
        }

        // เริ่มทำแบบทดสอบ
        function startQuiz(mode) {
            currentMode = mode;
            score = 0;
            currentQuestionIndex = 0;
            userAnswers = [];
            
            if (mode === 'full') {
                currentQuestions = [...quizData].sort(() => Math.random() - 0.5);
                // ตัดให้เหลือ 30 ข้อ (ในกรณีที่ฐานข้อมูลมีมากกว่า)
                if(currentQuestions.length > 30) currentQuestions = currentQuestions.slice(0, 30);
            } else if (mode === 'adaptive') {
                currentQuestions = generateAdaptiveSet();
            }

            document.getElementById('total-q-num').innerText = currentQuestions.length;
            document.getElementById('max-score-display').innerText = currentQuestions.length;
            
            showScreen('quiz');
            loadQuestion();
        }

        // โหลดคำถามขึ้นหน้าจอ
        function loadQuestion() {
            const questionData = currentQuestions[currentQuestionIndex];
            
            // Update Progress
            document.getElementById('current-q-num').innerText = currentQuestionIndex + 1;
            const progress = ((currentQuestionIndex) / currentQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            
            // Update Topic Badge
            const topicDisplay = topicNames[questionData.topic] || 'ทั่วไป';
            document.getElementById('topic-badge').innerText = 'หมวด: ' + topicDisplay;

            // Update Text
            document.getElementById('question-text').innerText = (currentQuestionIndex + 1) + ". " + questionData.question;
            
            // Update Image (if exists)
            const imgContainer = document.getElementById('image-container');
            const imgElement = document.getElementById('question-image');
            if (questionData.image) {
                imgElement.src = questionData.image;
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.classList.add('hidden');
            }

            // Clear and Load Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            // Shuffle options
            let options = [...questionData.options];
            options.sort(() => Math.random() - 0.5);

            options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border-2 border-gray-200 bg-white hover:border-indigo-300 hover:bg-indigo-50 text-gray-700 font-medium option-btn';
                btn.innerHTML = `<span class="inline-block w-6 font-bold text-indigo-500">${String.fromCharCode(65 + index)}.</span> ${opt}`;
                btn.onclick = () => selectOption(btn, opt, questionData.correctAnswer);
                optionsContainer.appendChild(btn);
            });

            // Hide next button initially
            document.getElementById('next-btn-container').style.display = 'none';
        }

        // เมื่อผู้ใช้เลือกคำตอบ
        function selectOption(selectedBtn, selectedText, correctText) {
            // Disable all buttons
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('opacity-70', 'cursor-not-allowed');
                btn.classList.remove('hover:border-indigo-300', 'hover:bg-indigo-50');
            });

            const isCorrect = selectedText === correctText;
            const currentQ = currentQuestions[currentQuestionIndex];

            // อัปเดตสถิติสำหรับ Adaptive mode
            updateTopicStats(currentQ.topic, isCorrect);

            // บันทึกคำตอบ
            userAnswers.push({
                questionData: currentQ,
                selectedAnswer: selectedText,
                isCorrect: isCorrect
            });

            if (isCorrect) {
                score++;
                selectedBtn.classList.add('correct-option');
                selectedBtn.innerHTML += ' <i class="fas fa-check-circle float-right text-xl mt-0.5"></i>';
            } else {
                selectedBtn.classList.add('wrong-option');
                selectedBtn.innerHTML += ' <i class="fas fa-times-circle float-right text-xl mt-0.5"></i>';
                
                // ไฮไลต์ข้อที่ถูกด้วย
                buttons.forEach(btn => {
                    if (btn.innerText.includes(correctText)) {
                        btn.classList.add('correct-option', 'opacity-100');
                        btn.classList.remove('opacity-70');
                    }
                });
            }

            // Show next button
            const nextBtnContainer = document.getElementById('next-btn-container');
            nextBtnContainer.style.display = 'flex';
            
            // เปลี่ยนข้อความปุ่มถ้าเป็นข้อสุดท้าย
            if (currentQuestionIndex === currentQuestions.length - 1) {
                const nextBtn = nextBtnContainer.querySelector('button');
                nextBtn.innerHTML = 'ดูผลคะแนน <i class="fas fa-flag-checkered ml-2"></i>';
                nextBtn.classList.replace('bg-dark', 'bg-primary');
                nextBtn.classList.replace('hover:bg-gray-800', 'hover:bg-indigo-700');
            }
        }

        // ไปข้อถัดไปหรือจบเกม
        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        // สรุปผล
        function finishQuiz() {
            document.getElementById('score-display').innerText = score;
            const percentage = (score / currentQuestions.length) * 100;
            const msgEl = document.getElementById('result-message');
            
            if (percentage >= 80) {
                msgEl.innerText = "ยอดเยี่ยมมาก! คุณมีความรู้เรื่องระบบประสาทเป็นอย่างดี";
                msgEl.className = "text-lg text-emerald-600 mb-8 font-semibold";
            } else if (percentage >= 50) {
                msgEl.innerText = "ทำได้ดี! แต่ยังสามารถทบทวนเพิ่มเติมได้อีกนะ";
                msgEl.className = "text-lg text-blue-600 mb-8 font-semibold";
            } else {
                msgEl.innerText = "พยายามอีกนิด! ลองทบทวนบทเรียนแล้วมาทดสอบใหม่นะ";
                msgEl.className = "text-lg text-orange-600 mb-8 font-semibold";
            }

            showScreen('result');
        }

        // กลับหน้าแรก
        function restartQuiz() {
            // Reset next button state
            const nextBtnContainer = document.getElementById('next-btn-container');
            const nextBtn = nextBtnContainer.querySelector('button');
            nextBtn.innerHTML = 'ข้อต่อไป <i class="fas fa-arrow-right ml-2"></i>';
            nextBtn.classList.remove('bg-primary', 'hover:bg-indigo-700');
            nextBtn.classList.add('bg-dark', 'hover:bg-gray-800');
            
            showScreen('start');
        }

        function showResultScreen() {
            showScreen('result');
        }

        // แสดงหน้าเฉลย
        function reviewAnswers() {
            const reviewContainer = document.getElementById('review-container');
            reviewContainer.innerHTML = '';

            userAnswers.forEach((ans, index) => {
                const item = document.createElement('div');
                item.className = 'bg-white border rounded-xl p-5 shadow-sm';
                
                const isCorrect = ans.isCorrect;
                const icon = isCorrect ? '<i class="fas fa-check-circle text-secondary text-xl"></i>' : '<i class="fas fa-times-circle text-red-500 text-xl"></i>';
                const borderColor = isCorrect ? 'border-l-4 border-l-secondary' : 'border-l-4 border-l-red-500';
                
                item.classList.add(...borderColor.split(' '));

                let imageHtml = '';
                if (ans.questionData.image) {
                    imageHtml = `<div class="mt-3 mb-3"><img src="${ans.questionData.image}" class="max-h-32 rounded border object-contain" alt="ภาพประกอบ" onerror="this.onerror=null;this.style.display='none';"></div>`;
                }

                item.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="mt-1">${icon}</div>
                        <div class="flex-1">
                            <h3 class="font-medium text-gray-800 text-base md:text-lg mb-2">ข้อ ${index + 1}: ${ans.questionData.question}</h3>
                            ${imageHtml}
                            <div class="bg-gray-50 rounded-lg p-3 text-sm space-y-2">
                                <p class="text-gray-600"><span class="font-semibold">คุณตอบ:</span> <span class="${isCorrect ? 'text-secondary font-medium' : 'text-red-500 font-medium'}">${ans.selectedAnswer}</span></p>
                                ${!isCorrect ? `<p class="text-gray-600"><span class="font-semibold text-emerald-600">คำตอบที่ถูกต้อง:</span> ${ans.questionData.correctAnswer}</p>` : ''}
                                <p class="text-xs text-indigo-400 mt-2"><i class="fas fa-tag"></i> หมวด: ${topicNames[ans.questionData.topic] || 'ทั่วไป'}</p>
                            </div>
                        </div>
                    </div>
                `;
                reviewContainer.appendChild(item);
            });

            showScreen('review');
        }
    </script>
</body>
</html>
