            { id: 4, question: "ข้อใดกล่าว 'ผิด' เกี่ยวกับกลไกการสั่งการในปฏิกิริยารีเฟล็กซ์ที่หัวเข่า", options: ["ไม่ต้องรอคำสั่งจากสมอง", "เป็นระบบประสาทภายใต้อำนาจจิตใจ", "ช่วยป้องกันอันตรายให้ร่างกาย", "ตอบสนองได้อย่างรวดเร็ว"], correctAnswer: "เป็นระบบประสาทภายใต้อำนาจจิตใจ", topic: "reflex" },
            { id: 16, question: "วงจรรีเฟล็กซ์แบบใดที่ไม่มีเซลล์ประสาทประสานงาน (Interneuron) เข้ามาเกี่ยวข้องเลย", options: ["Monosynaptic reflex", "Polysynaptic reflex", "Cranial reflex", "Conditioned reflex"], correctAnswer: "Monosynaptic reflex", topic: "reflex" },
            { id: 17, question: "การตอบสนองข้อใดเป็นการทำงานของ Cranial Reflex (รีเฟล็กซ์ที่ใช้ก้านสมอง)", options: ["ชักมือหนีของร้อน", "การไอเมื่อมีเศษอาหารติดคอ", "เข่ากระตุกเมื่อถูกเคาะ", "การเดินทรงตัวบนสะพาน"], correctAnswer: "การไอเมื่อมีเศษอาหารติดคอ", topic: "reflex" },
            
            // --- หมวด Brain ---

            { id: 6, question: "ความรู้สึกเจ็บ (Pain) จากการเหยียบตะปู ถูกส่งไปประมวลผลที่บริเวณใดของสมองส่วนเซรีบรัม", options: ["พูหน้า (Frontal lobe)", "พูข้าง (Parietal lobe)", "พูขมับ (Temporal lobe)", "พูท้ายทอย (Occipital lobe)"], correctAnswer: "พูข้าง (Parietal lobe)", topic: "brain" },

            { id: 18, question: "สมองส่วนใดทำหน้าที่เป็น 'สถานีถ่ายทอด' (Relay station) ส่งกระแสประสาทรับความรู้สึกไปยังเซรีบรัม", options: ["ไฮโปทาลามัส", "ทาลามัส", "พอนส์", "เมดัลลาออบลองกาตา"], correctAnswer: "ทาลามัส", topic: "brain" },
            { id: 19, question: "ศูนย์ควบคุมการหายใจและการเต้นของหัวใจอยู่ที่สมองส่วนใด", options: ["เซรีบรัม", "ทาลามัส", "เมดัลลาออบลองกาตา", "เซรีเบลลัม"], correctAnswer: "เมดัลลาออบลองกาตา", topic: "brain" },
            { id: 20, question: "ถ้าสมองส่วนไฮโปทาลามัส (Hypothalamus) ได้รับความเสียหาย จะส่งผลต่อเรื่องใดมากที่สุด", options: ["การมองเห็น", "การทรงตัว", "การรักษาสมดุลอุณหภูมิร่างกาย", "การจำคำศัพท์"], correctAnswer: "การรักษาสมดุลอุณหภูมิร่างกาย", topic: "brain" },
            
            // --- หมวด Nerves & Cells ---

            { id: 9, question: "กล้ามเนื้อต้นขา ในปฏิกิริยารีเฟล็กซ์หัวเข่า ทำหน้าที่เป็นอะไร", options: ["หน่วยรับความรู้สึก (Receptor)", "หน่วยประมวลผล (Center)", "หน่วยปฏิบัติงาน (Effector)", "เซลล์ประสาทสั่งการ (Motor neuron)"], correctAnswer: "หน่วยปฏิบัติงาน (Effector)", topic: "nerves" },
            { id: 10, question: "ความเร็วในการนำกระแสประสาทในวงจรรีเฟล็กซ์จะเพิ่มขึ้นได้เนื่องจากปัจจัยใด", options: ["การมีปลอกไมอีลิน (Myelin sheath) หุ้มแอกซอน", "ขนาดของเซลล์ประสาทที่เล็กลง", "การลดอุณหภูมิของร่างกาย", "การเพิ่มจำนวนจุดประสานประสาท (Synapse)"], correctAnswer: "การมีปลอกไมอีลิน (Myelin sheath) หุ้มแอกซอน", topic: "cells" },
            { id: 11, question: "ส่วนใดของเซลล์ประสาทที่ทำหน้าที่นำกระแสประสาท 'ออกจาก' ตัวเซลล์ไปยังเซลล์ถัดไป", options: ["เดนไดรต์ (Dendrite)", "แอกซอน (Axon)", "นิวเคลียส (Nucleus)", "ไซแนปส์ (Synapse)"], correctAnswer: "แอกซอน (Axon)", topic: "cells" },
            { id: 21, question: "รอยคอดระหว่างปลอกไมอีลินที่ช่วยให้กระแสประสาทกระโดดได้เร็วขึ้นเรียกว่าอะไร", options: ["ซินแนปติกเคลฟต์", "โหนดออฟแรนเวียร์ (Node of Ranvier)", "ชวานน์เซลล์", "แอกซอนเทอร์มินัล"], correctAnswer: "โหนดออฟแรนเวียร์ (Node of Ranvier)", topic: "cells" },
            { id: 22, question: "สารสื่อประสาท (Neurotransmitter) จะถูกหลั่งออกจากส่วนใดของเซลล์ประสาท", options: ["ปลายเดนไดรต์", "นิวเคลียส", "ปลายแอกซอน", "เซลล์ชวานน์"], correctAnswer: "ปลายแอกซอน", topic: "cells" },
            
            // --- หมวด Autonomic & Behavior ---
            { id: 12, question: "เมื่ออุณหภูมิภายนอกลดต่ำลง ร่างกายเกิดอาการขนลุก (Goosebumps) การตอบสนองนี้ควบคุมโดยส่วนใดเป็นหลัก", options: ["ก้านสมองและระบบประสาทอัตโนมัติ", "สมองส่วนหน้า", "ไขสันหลัง", "ระบบประสาทโซมาติก"], correctAnswer: "ก้านสมองและระบบประสาทอัตโนมัติ", topic: "autonomic" },

            { id: 14, question: "พิจารณาข้อความ: 'เมื่อเห็นไฟแดง คนขับรถจะเหยียบเบรกทันที' ข้อใดระบุกลไกได้ถูกต้องที่สุด", options: ["เป็นปฏิกิริยารีเฟล็กซ์พื้นฐาน", "เป็นพฤติกรรมการเรียนรู้แบบมีเงื่อนไข (Conditioned reflex)", "ควบคุมโดยไขสันหลังเท่านั้น", "เป็นพฤติกรรมที่มีมาแต่กำเนิด"], correctAnswer: "เป็นพฤติกรรมการเรียนรู้แบบมีเงื่อนไข (Conditioned reflex)", topic: "behavior" },
            { id: 23, question: "ระบบประสาทซิมพาเทติก (Sympathetic) จะทำงานหนักที่สุดในสถานการณ์ใด", options: ["นอนหลับพักผ่อน", "กินอาหารมื้อใหญ่", "วิ่งหนีสุนัขดุ", "นั่งสมาธิ"], correctAnswer: "วิ่งหนีสุนัขดุ", topic: "autonomic" },
            { id: 24, question: "ข้อใดเป็นผลจากการทำงานของระบบประสาทพาราซิมพาเทติก (Parasympathetic)", options: ["รูม่านตาขยาย", "หัวใจเต้นเร็วขึ้น", "กระตุ้นการย่อยอาหาร", "หลอดลมขยายตัว"], correctAnswer: "กระตุ้นการย่อยอาหาร", topic: "autonomic" },
            
            // --- หมวด Clinical ---
            { id: 15, question: "เหตุใดแพทย์จึงใช้การเคาะที่หัวเข่าเพื่อตรวจเช็กระบบประสาท", options: ["เพื่อวัดระดับแคลเซียมในกระดูก", "เพื่อประเมินความสมบูรณ์ของไขสันหลังและเส้นประสาท", "เพื่อตรวจการทำงานของสมองใหญ่", "เพื่อดูความแข็งแรงของกล้ามเนื้อ"], correctAnswer: "เพื่อประเมินความสมบูรณ์ของไขสันหลังและเส้นประสาท", topic: "clinical" },
            { id: 25, question: "หากเคาะที่เอ็นใต้ลูกสะบ้าแล้วขาไม่กระตุก แพทย์อาจสันนิษฐานได้ว่าเกิดความผิดปกติที่ใด", options: ["สมองส่วนหน้า", "ไขสันหลังระดับเอวลงไป", "ก้านสมอง", "สมองซีรีเบลลัม"], correctAnswer: "ไขสันหลังระดับเอวลงไป", topic: "clinical" },

            { id: 27, question: "เซลล์ประสาทรับความรู้สึก (Sensory neuron) มักจะมีรูปร่างลักษณะใด", options: ["เซลล์ประสาทขั้วเดียว", "เซลล์ประสาทสองขั้ว", "เซลล์ประสาทหลายขั้ว", "ไม่มีแอกซอน"], correctAnswer: "เซลล์ประสาทขั้วเดียว", topic: "cells" },
